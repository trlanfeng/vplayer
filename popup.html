<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VPlayer</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <header class="brand-row"><div class="brand"><span class="brand-icon">▶</span><span>VPlayer<span class="brand-dot">.</span></span></div><span class="eyebrow">让播放更从容</span></header>
  <section class="popup-heading"><span class="eyebrow">当前网页</span><h1>发现视频<span id="source-count">0</span></h1><p id="page-title" class="muted truncate">正在读取网页…</p></section>
  <div id="source-list" class="source-list" aria-live="polite"></div>
  <div id="empty" class="empty-state" hidden><div class="empty-symbol">⌁</div><strong>等待视频出现</strong><p>先在网页中播放视频，再打开这里。<br>已打开的视频可以刷新网页后重试。</p></div>
  <form id="manual-form" class="manual-form"><label for="manual-url">也可以直接粘贴视频地址</label><div class="input-action"><input id="manual-url" type="url" placeholder="https://…/video.m3u8" required autocomplete="off"><button type="submit" class="icon-button" aria-label="播放粘贴的视频地址">↗</button></div></form>
  <p id="popup-error" class="error-text" role="alert" hidden></p>
  <footer class="popup-footer"><span class="status-dot"></span>并发预加载 · 本地缓存<span class="version">v0.2.1</span></footer>
  <script src="popup.js" type="module"></script>
</body></html>
