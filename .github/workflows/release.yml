name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify release version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const version = read('package.json').version;
          if (process.env.GITHUB_REF_NAME !== `v${version}` || read('manifest.json').version !== version || read('package-lock.json').version !== version) {
            throw new Error('Release tag, package and extension versions must match');
          }
          JS
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="vplayer-extension-${version}.zip"
          (cd dist && zip -qr "../releases/${archive}" .)
          (cd releases && sha256sum "$archive" > "${archive}.sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "releases/vplayer-extension-${version}.zip" \
            "releases/vplayer-extension-${version}.zip.sha256" \
            --verify-tag --title "VPlayer ${GITHUB_REF_NAME}" \
            --notes-file "releases/${GITHUB_REF_NAME}.md" --latest
